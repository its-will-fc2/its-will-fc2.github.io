<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>will@portfolio:~$</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #060a06;
    font-family: 'Share Tech Mono', 'VT323', monospace;
    overflow: hidden;
  }

  .crt {
    position: relative;
    width: 100vw; height: 100vh;
    background: radial-gradient(ellipse at center, #0a1a0a 0%, #030603 100%);
  }
  .crt::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,255,70,0.06),
      rgba(0,255,70,0.06) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 5;
  }
  .crt::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
    z-index: 6;
  }
  .flicker { animation: flicker 6s infinite; }
  @keyframes flicker {
    0%, 96%, 100% { opacity: 1; }
    97% { opacity: 0.94; }
    98% { opacity: 1; }
    99% { opacity: 0.96; }
  }

  #terminal-wrap {
    position: relative;
    width: min(920px, 92vw);
    height: min(640px, 86vh);
    margin: 3vh auto;
    background: #04140a;
    border: 2px solid #1a4d2e;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(0,255,90,0.15), inset 0 0 60px rgba(0,50,20,0.5);
    display: flex;
    flex-direction: column;
    z-index: 2;
  }
  #titlebar {
    background: #0d2818;
    border-bottom: 1px solid #1a4d2e;
    padding: 8px 14px;
    color: #6fffb0;
    font-size: 13px;
    letter-spacing: 1px;
    border-radius: 10px 10px 0 0;
    display: flex;
    justify-content: space-between;
  }
  #output {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    color: #4bff7e;
    font-size: 16px;
    line-height: 1.5;
    text-shadow: 0 0 4px rgba(75,255,126,0.6);
  }
  #output::-webkit-scrollbar { width: 8px; }
  #output::-webkit-scrollbar-thumb { background: #1a4d2e; border-radius: 4px; }

  .line { white-space: pre-wrap; word-break: break-word; margin-bottom: 2px; }
  .prompt-line { color: #8fffb0; }
  .cmd-echo { color: #c8ffe0; }
  .section-title { color: #ffe08a; font-weight: bold; }
  .dim { color: #2f8a55; }
  .error { color: #ff6b6b; }
  .link { color: #7fd9ff; text-decoration: underline; }

  #input-line {
    display: flex;
    align-items: center;
    padding: 10px 18px 16px 18px;
    border-top: 1px solid #1a4d2e;
  }
  #prompt-label {
    color: #8fffb0;
    margin-right: 8px;
    font-size: 16px;
    white-space: nowrap;
  }
  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #4bff7e;
    font-family: inherit;
    font-size: 16px;
    caret-color: #4bff7e;
  }
</style>
</head>
<body>
<div class="crt flicker">
  <div id="terminal-wrap">
    <div id="titlebar">
      <span>will@portfolio: ~</span>
      <span>[ TYPE 'help' TO BEGIN ]</span>
    </div>
    <div id="output"></div>
    <div id="input-line">
      <span id="prompt-label">will@portfolio:~$</span>
      <input id="cmd-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
    </div>
  </div>
</div>
<script src="content.js"></script>
<script src="main.js"></script>
</body>
</html>
