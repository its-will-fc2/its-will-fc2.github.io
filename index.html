<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Will Huang | Kaiju Portfolio</title>
<style>
  html, body { margin:0; padding:0; background:#0b0f14; overflow:hidden; font-family: 'Courier New', monospace; }
  #game-container { display:flex; justify-content:center; align-items:center; height:100vh; }
  #modal {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(5,10,15,0.92); display:none; z-index:10;
    justify-content:center; align-items:center;
  }
  #modal-box {
    background:#10181f; border:3px solid #4ee44e; border-radius:8px;
    max-width:640px; width:88%; max-height:80vh; overflow-y:auto;
    padding:28px 32px; color:#d7ffe0; box-shadow:0 0 30px rgba(78,228,78,0.4);
  }
  #modal-box h2 { color:#4ee44e; margin-top:0; letter-spacing:1px; text-transform:uppercase; }
  #modal-box ul { padding-left:20px; }
  #modal-box li { margin-bottom:8px; line-height:1.4; }
  #modal-box .entry-title { color:#9be89b; font-weight:bold; }
  #modal-box .entry-date { color:#6b8f6b; font-size:0.85em; }
  #close-btn {
    margin-top:18px; background:#4ee44e; border:none; color:#0b0f14;
    padding:8px 18px; font-weight:bold; cursor:pointer; border-radius:4px;
    font-family:inherit;
  }
  #hint {
    position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
    color:#8fbf8f; font-size:13px; background:rgba(0,0,0,0.4); padding:6px 14px;
    border-radius:6px; letter-spacing:0.5px;
  }
</style>
</head>
<body>
<div id="game-container"></div>
<div id="hint">ARROW KEYS / A-D: walk &nbsp;|&nbsp; SPACE: roar &nbsp;|&nbsp; F: fire atomic beam at a building</div>
<div id="modal">
  <div id="modal-box">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <button id="close-btn">Close</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="src/content.js"></script>
<script src="src/main.js"></script>
</body>
</html>
