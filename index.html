<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will Huang | Project KAIJU-SEC</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Courier New", Courier, monospace;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b10;
      color: #c9d1d9;
    }

    /* Screen shake container */
    #viewport {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .shaking {
      animation: shake 0.12s infinite;
    }

    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      25% { transform: translate(-2px, -2px) rotate(-0.5deg); }
      50% { transform: translate(2px, 0px) rotate(0.5deg); }
      75% { transform: translate(-1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -1px) rotate(0deg); }
    }

    /* Background Parallax Skyline */
    #skyline {
      position: absolute;
      bottom: 60px;
      left: 0;
      height: 240px;
      width: 6000px;
      background: repeating-linear-gradient(
        to right,
        #111622 0px,
        #111622 45px,
        #0b0e14 45px,
        #0b0e14 65px,
        #161d2d 65px,
        #161d2d 120px,
        transparent 120px,
        transparent 145px
      );
      opacity: 0.55;
      pointer-events: none;
    }

    /* Ground plane */
    #ground {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: #161b22;
      border-top: 2px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      z-index: 5;
    }

    /* World container (moves left as Godzilla walks right) */
    #world {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 5000px;
      transition: transform 0.05s linear;
      z-index: 6;
    }

    /* Defense Towers / Sector Nodes */
    .tower {
      position: absolute;
      bottom: 60px;
      width: 100px;
      height: 220px;
      background: #0d131a;
      border: 1px solid #30363d;
      border-top: 3px solid #58a6ff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .tower:hover, .tower.hit {
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
    }

    .tower-tag {
      font-size: 0.7rem;
      color: #00f0ff;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .tower-title {
      font-size: 0.8rem;
      text-align: center;
      color: #f0f6fc;
      padding: 0 4px;
    }

    /* Godzilla Vector Sprite */
    #kaiju {
      position: absolute;
      bottom: 50px;
      left: 80px;
      width: 220px;
      height: 220px;
      z-index: 10;
      transform-origin: bottom center;
      transition: transform 0.15s ease-out;
    }

    /* Silhouette Styling */
    .kaiju-body {
      fill: #0d1117;
      stroke: #1b222d;
      stroke-width: 1.5;
    }

    /* Spine glow animation classes */
    .spine {
      fill: #161b22;
      transition: fill 0.2s ease, filter 0.2s ease;
    }

    .spine-charged {
      fill: #00f0ff !important;
      filter: drop-shadow(0 0 8px #00f0ff) drop-shadow(0 0 16px #39c5bb);
    }

    /* Stomp Animation */
    .stomping {
      animation: heavyStomp 0.4s ease forwards;
    }

    @keyframes heavyStomp {
      0% { transform: translateY(0); }
      40% { transform: translateY(-16px) rotate(-1deg); }
      75% { transform: translateY(0) rotate(1deg); }
      100% { transform: translateY(0); }
    }

    /* Atomic Beam */
    #atomic-beam {
      position: absolute;
      bottom: 150px;
      left: 260px;
      height: 24px;
      width: 0px;
      background: linear-gradient(90deg, rgba(255,255,255,0.95), #00f0ff 40%, rgba(0,240,255,0.1));
      border-radius: 12px;
      box-shadow: 0 0 25px #00f0ff, 0 0 45px #39c5bb;
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      transition: width 0.15s ease-out, opacity 0.1s;
    }

    /* Tactical HUD */
    #hud {
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 50;
    }

    .hud-box {
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid #00f0ff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
      border-radius: 4px;
      padding: 12px 18px;
    }

    .hud-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: #00f0ff;
    }

    .hud-controls {
      font-size: 0.75rem;
      color: #8b949e;
      margin-top: 4px;
    }

    /* Modal Dossier Overlay */
    #modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 7, 11, 0.82);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    #modal-overlay.hidden {
      display: none;
    }

    .modal-frame {
      position: relative;
      background: #0d1117;
      border: 1px solid #00f0ff;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
      width: 85%;
      max-width: 860px;
      max-height: 82vh;
      overflow-y: auto;
      padding: 28px 32px;
      border-radius: 4px;
    }

    #modal-close {
      position: absolute;
      top: 14px;
      right: 18px;
      background: none;
      border: none;
      color: #00f0ff;
      font-size: 1.6rem;
      cursor: pointer;
    }

    /* Modal Layouts & Placeholders */
    .sector-title {
      color: #00f0ff;
      font-size: 1.25rem;
      margin-bottom: 14px;
      letter-spacing: 1px;
    }

    .section-divider {
      border: 0;
      height: 1px;
      background: #30363d;
      margin: 16px 0;
    }

    .profile-wrap {
      display: flex;
      gap: 20px;
      margin-bottom: 14px;
    }

    .img-slot {
      border: 2px dashed rgba(0, 240, 255, 0.4);
      background: rgba(0, 240, 255, 0.03);
      color: #00f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      font-size: 0.75rem;
      border-radius: 4px;
    }

    .id-photo { width: 140px; height: 160px; flex-shrink: 0; }
    .hobby-photo { height: 95px; margin-top: 10px; }
    .banner-photo { height: 110px; margin-top: 14px; }
    .project-photo { height: 100px; margin-top: 8px; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 12px;
      border-radius: 4px;
    }

    .card h4 { color: #58a6ff; font-size: 0.95rem; margin-bottom: 6px; }
    .card p, .card li { font-size: 0.85rem; }
    ul { margin-left: 18px; margin-top: 6px; }
  </style>
</head>

  <script>
    // --- Synthesized Web Audio Engine ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // Heavy Stomp Bass Thud
    function playStompSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(80, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    // Atomic Breath Plasma Charge & Roar Blast
    function playBeamSound() {
      if (!audioCtx) return;
      // High-pitch charging tone
      const chargeOsc = audioCtx.createOscillator();
      const chargeGain = audioCtx.createGain();
      chargeOsc.type = "sine";
      chargeOsc.frequency.setValueAtTime(300, audioCtx.currentTime);
      chargeOsc.frequency.linearRampToValueAtTime(850, audioCtx.currentTime + 0.5);
      chargeGain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      chargeGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.5);
      chargeOsc.connect(chargeGain);
      chargeGain.connect(audioCtx.destination);
      chargeOsc.start();
      chargeOsc.stop(audioCtx.currentTime + 0.5);

      // Low frequency plasma blast
      setTimeout(() => {
        const blastOsc = audioCtx.createOscillator();
        const blastGain = audioCtx.createGain();
        blastOsc.type = "sawtooth";
        blastOsc.frequency.setValueAtTime(160, audioCtx.currentTime);
        blastOsc.frequency.linearRampToValueAtTime(45, audioCtx.currentTime + 0.7);
        blastGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
        blastGain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.7);
        blastOsc.connect(blastGain);
        blastGain.connect(audioCtx.destination);
        blastOsc.start();
        blastOsc.stop(audioCtx.currentTime + 0.7);
      }, 500);
    }

    // --- State & Selectors ---
    let worldX = 0;
    let isFiring = false;
    let isModalOpen = false;

    const viewport = document.getElementById("viewport");
    const world = document.getElementById("world");
    const skyline = document.getElementById("skyline");
    const kaiju = document.getElementById("kaiju");
    const beam = document.getElementById("atomic-beam");
    const spines = [1, 2, 3, 4, 5].map(i => document.getElementById(`spine-${i}`));
    const towers = document.querySelectorAll(".tower");

    const modal = document.getElementById("modal-overlay");
    const modalBody = document.getElementById("modal-body");
    const modalClose = document.getElementById("modal-close");

    // Open Sector Dossier
    function openSector(secId) {
      const tpl = document.getElementById(`tpl-${secId}`);
      if (!tpl) return;
      modalBody.innerHTML = tpl.innerHTML;
      modal.classList.remove("hidden");
      isModalOpen = true;
    }

    modalClose.addEventListener("click", () => {
      modal.classList.add("hidden");
      isModalOpen = false;
    });

    // Manual click on towers
    towers.forEach(t => {
      t.addEventListener("click", () => openSector(t.dataset.sector));
    });

    // Stomp Movement Handler
    function step(dir) {
      if (isFiring || isModalOpen) return;
      initAudio();

      worldX += dir * 45;
      if (worldX > 0) worldX = 0;
      if (worldX < -3200) worldX = -3200;

      world.style.transform = `translateX(${worldX}px)`;
      skyline.style.transform = `translateX(${worldX * 0.3}px)`;

      // Trigger heavy footstep animation & audio
      kaiju.classList.remove("stomping");
      void kaiju.offsetWidth; // force reflow
      kaiju.classList.add("stomping");

      viewport.classList.add("shaking");
      setTimeout(() => viewport.classList.remove("shaking"), 120);

      playStompSound();
    }

    // Sequential Spine Charge & Atomic Breath
    function fireAtomicBreath() {
      if (isFiring || isModalOpen) return;
      initAudio();
      isFiring = true;

      playBeamSound();

      // Charge dorsal plates from tail to neck
      spines.forEach((spine, idx) => {
        setTimeout(() => {
          spine.classList.add("spine-charged");
        }, idx * 100);
      });

      // Fire horizontal beam after charge completes (500ms)
      setTimeout(() => {
        viewport.classList.add("shaking");
        beam.style.opacity = "1";
        beam.style.width = "750px";

        // Check collision between beam range and target towers
        const kaijuScreenRight = 80 + 220;
        towers.forEach(tower => {
          const towerPos = tower.offsetLeft + worldX;
          if (towerPos > kaijuScreenRight && towerPos < kaijuScreenRight + 750) {
            tower.classList.add("hit");
            setTimeout(() => {
              tower.classList.remove("hit");
              openSector(tower.dataset.sector);
            }, 300);
          }
        });

        // Retract beam and cool down spines
        setTimeout(() => {
          beam.style.width = "0px";
          beam.style.opacity = "0";
          viewport.classList.remove("shaking");
          spines.forEach(s => s.classList.remove("spine-charged"));
          isFiring = false;
        }, 450);

      }, 550);
    }

    // Keyboard bindings
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
        step(-1);
      } else if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
        step(1);
      } else if (e.code === "Space") {
        e.preventDefault();
        fireAtomicBreath();
      } else if (e.key === "Escape" && isModalOpen) {
        modal.classList.add("hidden");
        isModalOpen = false;
      }
    });
  </script>
